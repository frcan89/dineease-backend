# openapi/schemas/ItemPedidoSchema.yaml
type: object
properties:
  id_item_pedido: { type: integer, readOnly: true }
  id_pedido: { type: integer }
  id_item_menu: { type: integer }
  cantidad: { type: integer }
  precio_unitario_momento: { type: number, format: float }
  notas_item: { type: string, nullable: true }
  # ... timestamps y campos de eliminación ...
  ItemMenu: # Incluir info del ItemMenu para mostrar detalles del producto
    type: object
    nullable: true
    properties:
      precio_item: { type: number, format: float }
      Receta:
        type: object
        nullable: true
        properties:
          nombre: { type: string }