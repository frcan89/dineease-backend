# openapi/schemas/ItemPedidoSchema.yaml
type: object
properties:
  id_item_pedido:
    type: integer
    readOnly: true
    example: 25
  id_pedido:
    type: integer
    readOnly: true
    example: 16
  id_menu: # Recuerda, esto se mapea a la columna 'id_item_menu' si no pudiste cambiar la BD
    type: integer
    readOnly: true
    example: 1
  cantidad:
    type: integer
    example: 2
  precio_unitario_momento:
    type: number
    format: float
    readOnly: true
    description: "Precio del menú al momento en que se realizó el pedido."
    example: 30.00
  notas_item:
    type: string
    nullable: true
    example: "Uno de los menús bajo en sal."
  # Los timestamps y campos de eliminación de ItemPedido se pueden omitir aquí por simplicidad
  Menu: # Objeto anidado con la información del Menú pedido
    type: object
    readOnly: true
    nullable: true
    properties:
      id_menu:
        type: integer
      nombre:
        type: string
        example: "Menú del Día"
      descripcion:
        type: string
        nullable: true