# openapi/schemas/MenuInputSchema.yaml
type: object
required:
  - nombre
  - precio_venta
properties:
  nombre:
    type: string
    maxLength: 255
    example: "Menú de Noche"
  descripcion:
    type: string
    nullable: true
  costo_total:
    type: number
    format: float
    nullable: true
    minimum: 0
  precio_venta:
    type: number
    format: float
    minimum: 0
  estado:
    type: string
    default: "Activo"
    example: "Activo"