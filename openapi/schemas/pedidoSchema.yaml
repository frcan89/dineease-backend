# openapi/schemas/PedidoSchema.yaml
type: object
properties:
  id_pedido: { type: integer, readOnly: true }
  id_mesa: { type: integer, nullable: true }
  id_usuario_empleado: { type: integer }
  id_cliente: { type: integer, nullable: true }
  estado: { type: string, example: "Pendiente" }
  subtotal: { type: number, format: float }
  id_restaurante: { type: integer }
  # ... timestamps y campos de eliminación ...
  empleado:
    type: object
    nullable: true
    properties:
      id_usuario: { type: integer }
      nombre: { type: string }
  cliente:
    type: object
    nullable: true
    properties:
      id_usuario: { type: integer }
      nombre: { type: string }
  Mesa:
    type: object
    nullable: true
    properties:
      id_mesa: { type: integer }
      numero: { type: integer } # o string
  items:
    type: array
    items:
      $ref: '#/components/schemas/ItemPedido'