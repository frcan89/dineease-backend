# openapi/schemas/PagoSchema.yaml
type: object
properties:
  id_pago:
    type: integer
    readOnly: true
    example: 1
  id_pedido:
    type: integer
    readOnly: true
    example: 16
  monto:
    type: number
    format: float
    description: "Monto total recibido del cliente."
    example: 70.00
  cambio:
    type: number
    format: float
    description: "Cambio devuelto al cliente."
    example: 10.00
  metodo_pago:
    type: string
    example: "Efectivo"
  estado:
    type: string
    example: "Completado"
  fecha_pago:
    type: string
    format: date-time
    readOnly: true
  # ... otros campos de la tabla pago ...