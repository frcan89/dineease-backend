# openapi/schemas/PagoInputSchema.yaml
type: object
required:
  - monto
  - metodo_pago
properties:
  monto:
    type: number
    format: float
    description: "Monto total recibido del cliente. Debe ser >= al subtotal del pedido."
    minimum: 0
  metodo_pago:
    type: string
    example: "Tarjeta Credito"