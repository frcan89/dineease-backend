# openapi/schemas/PagoInputSchema.yaml
type: object
required:
  - monto
  - metodo_pago
properties:
  monto:
    type: number
    format: float
    description: "Monto total recibido del cliente. Debe ser mayor o igual al subtotal del pedido."
    minimum: 0
    example: 60.00
  metodo_pago:
    type: string
    enum: [Efectivo, Tarjeta Credito, Tarjeta Debito, Transferencia, Otro]
    example: "Efectivo"