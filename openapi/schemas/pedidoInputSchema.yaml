# openapi/schemas/PedidoInputSchema.yaml
type: object
required:
  - items
  # id_usuario_empleado y id_restaurante se toman del token
properties:
  id_mesa:
    type: integer
    nullable: true
    description: "ID de la mesa. Omitir para pedidos para llevar/delivery."
  id_cliente:
    type: integer
    nullable: true
    description: "ID del usuario cliente si está registrado."
  items:
    type: array
    minItems: 1
    items:
      type: object
      required: [ id_item_menu, cantidad ]
      properties:
        id_item_menu:
          type: integer
        cantidad:
          type: integer
          minimum: 1
        notas_item:
          type: string
          nullable: true