# openapi/schemas/ItemPedidoInputSchema.yaml
type: object
required:
  - id_menu
  - cantidad
properties:
  id_menu:
    type: integer
    description: "ID del menú a añadir al pedido."
    example: 2
  cantidad:
    type: integer
    description: "Cantidad a añadir. Si el menú ya existe en el pedido, esta cantidad se sumará."
    minimum: 1
    example: 1
  notas_item:
    type: string
    nullable: true
    description: "Notas específicas para este menú."